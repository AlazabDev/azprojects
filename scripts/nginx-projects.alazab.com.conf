# =============================================================================
# Nginx Configuration for projects.alazab.com
# AzProjects - Al-Azab Construction Architectural Management System
# =============================================================================

# Upstream Node.js application server
upstream azprojects_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server - Redirects all HTTP traffic to HTTPS (Certbot will manage this)
server {
    listen 80;
    listen [::]:80;
    server_name projects.alazab.com;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Active after SSL certificate issuance via Certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name projects.alazab.com;

    # SSL Certificates (Path managed by Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/projects.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projects.alazab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size (100MB) for Architectural drawings, AutoCAD files, and MagicPlan plans
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression for high-performance delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/projects_alazab_access.log;
    error_log /var/log/nginx/projects_alazab_error.log warn;

    # Reverse Proxy to AzProjects Node.js app
    location / {
        proxy_pass http://azprojects_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts (Extended to 300s for AI processing and Daftra/MagicPlan syncs)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
}
