# =============================================================================
# AzProjects - Nginx Production Configuration
# Domain: projects.alazab.com
# Platform: Ubuntu 22.04 / 24.04 LTS
# Target: Node.js / Express Reverse Proxy (http://127.0.0.1:3000)
# =============================================================================

# 1. Rate Limiting Zones (DDoS and Brute-Force Protection)
limit_req_zone $binary_remote_addr zone=az_api_limit:15m rate=25r/s;
limit_req_zone $binary_remote_addr zone=az_auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=az_conn_limit:10m;

# 2. HTTP Server: Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name projects.alazab.com;

    # Allow Let's Encrypt / Certbot domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect everything else to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Server: Production Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name projects.alazab.com;

    # SSL Certificates (Let's Encrypt Path)
    ssl_certificate /etc/letsencrypt/live/projects.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projects.alazab.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/projects.alazab.com/chain.pem;

    # Modern SSL Protocol & Ciphers (A+ Rating on Qualys SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:AzProjectsSSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Production Root Directory
    root /var/www/azprojects/dist;
    index index.html;

    # Request & Upload Buffer Limits (Supports large blueprints up to 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Slowloris & Timeout Protection
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Connection Limit per IP
    limit_conn az_conn_limit 30;

    # Security Headers (OWASP & HSTS Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # Content Security Policy (allows Supabase, Google Fonts & APIs, Daftra, MinIO)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.alazab.com https://cloud.magicplan.app https://apis.google.com; frame-src 'self' https://accounts.google.com; object-src 'none';" always;

    # Gzip & Static Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Hashed Static Assets (Vite creates cache-busted /assets/ hashes)
    location /assets/ {
        alias /var/www/azprojects/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. Public Static Media & Favicons
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 3. Sensitive Auth APIs - Strict Rate Limiting
    location /api/auth/ {
        limit_req zone=az_auth_limit burst=10 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 4. General Backend API Proxy & WebSockets
    location /api/ {
        limit_req zone=az_api_limit burst=35 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets & Upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # 5. SPA Fallback (Single Page Application Routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom Access & Error Logs
    access_log /var/log/nginx/azprojects_access.log;
    error_log /var/log/nginx/azprojects_error.log warn;
}
